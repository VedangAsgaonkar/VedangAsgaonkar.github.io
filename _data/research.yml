- dates: 2022
  title: Multi-strategy Moran processes
  where: Research assistant, Chatterjee group, ISTA
  summary: >-
    Fixation probabilities for Moran processes on graphs with three competing
    strategies. Found a martingale construction that generalizes beyond two strategies
    and gave new bounds for very low and very high mutation probabilities, presented
    as an internship thesis.

- dates: 2022
  title: Sentiment congruence in advertising
  where: Research assistant, Prof. Narayanan (Stanford GSB) and Prof. Anuj Kapoor (IIMA)
  summary: >-
    Field experiment with the content platform VDO.AI on how emotional congruence
    between a video and the ad served with it affects engagement, controlling for day,
    time, region and the video's base sentiment. Incongruent ads converted better.
  links:
    - label: SSRN
      url: https://ssrn.com/abstract=4131151
