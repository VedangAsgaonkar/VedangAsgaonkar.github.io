---
layout: default
---

<article class="shell post-content">
  <header class="page-intro post-intro">
    <p class="eyebrow">Writing · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
  <p class="back-link"><a href="{{ '/writing/' | relative_url }}">← All writing</a></p>
</article>
