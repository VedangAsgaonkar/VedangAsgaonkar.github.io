layout: default

<article class="shell page-content">
  <header class="page-intro">
    <p class="eyebrow">{{ page.eyebrow | default: 'Vedang Asgaonkar' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
