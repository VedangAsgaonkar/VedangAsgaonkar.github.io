---
layout: default
---
<article class="shell post-content">
  <header class="page-intro post-intro">
    <p class="eyebrow">Research · {{ page.venue }} {{ page.year }}</p>
    <h1>{{ page.title }}</h1>
    <p class="lede">{{ page.description }}</p>
    <p class="publication-meta">{{ page.authors }}<br><a href="{{ page.paper_url }}">Read the paper →</a></p>
  </header>
  <div class="prose">{{ content }}</div>
  <p class="back-link"><a href="{{ '/research/' | relative_url }}">← All research</a></p>
</article>
